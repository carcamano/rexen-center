# Formatting, lints and tests on Linux for pushes to main and pull requests.
# The tests need no XCP-ng host: the ones against a real host are #[ignore]d.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info: smaller test binaries, faster links, less memory.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: Build, clippy and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libdbus-1-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
