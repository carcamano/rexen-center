# Builds the release packages on GitHub-hosted runners:
#   macOS    rexen-center-<version>-macos-arm64.dmg (Apple Silicon)
#            rexen-center-<version>-macos-x86_64.dmg (Intel)
#   Windows  rexen-center-<version>-windows-x64.zip and .msi
#   Linux    rexen-center_<version>-1_amd64.deb (Debian, Ubuntu)
#            rexen-center-<version>-1.x86_64.rpm (Fedora)
#            rexen-center-<version>-linux-x86_64.tar.gz
#   SHA256SUMS of all of them, and SHA256SUMS.minisig when it is signed.
# A tag v<version> also publishes them as a GitHub Release with generated
# notes; the tag must match the workspace version in Cargo.toml. A push to
# release-prep or a manual run only attaches them to the run.
#
# Signing: the app's updater installs only a release whose SHA256SUMS is
# signed with the release key (crates/xen-update/src/signature.rs). With the
# repository secret RELEASE_SIGNING_KEY (the minisign secret key file,
# without a password) the checksums job signs it here; without it nothing is
# signed, and a tag makes a *draft* release for the owner to sign offline
# with packaging/sign-release.sh and then publish (see
# packaging/release-signing/README.md). The packages themselves are not
# code-signed or notarized.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [release-prep]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Read the workspace version and check the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (expected v$version)"
            exit 1
          fi

  macos:
    name: macOS (${{ matrix.arch }})
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update
          rustup default stable
      - name: Build the app and disk image
        env:
          TARGET: ${{ matrix.target }}
        run: packaging/macos/build.sh dist
      - name: Check the artifact name
        run: test -f "dist/rexen-center-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install the WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      - name: Build the zip and installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -Out dist
      - name: Check the artifact names
        shell: bash
        run: |
          test -f "dist/rexen-center-${{ needs.version.outputs.version }}-windows-x64.zip"
          test -f "dist/rexen-center-${{ needs.version.outputs.version }}-windows-x64.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: version
    # The oldest hosted Ubuntu, so the binary runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libdbus-1-dev dpkg-dev rpm
      - name: Install Rust and the packaging tools
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
      - name: Build the packages
        run: packaging/linux/build.sh dist
      - name: Check the packages
        run: |
          version=${{ needs.version.outputs.version }}
          test -f "dist/rexen-center-$version-linux-x86_64.tar.gz"
          test -f "dist/rexen-center_${version}-1_amd64.deb"
          test -f "dist/rexen-center-${version}-1.x86_64.rpm"
          dpkg-deb --info "dist/rexen-center_${version}-1_amd64.deb"
          dpkg-deb --contents "dist/rexen-center_${version}-1_amd64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      # For packaging/sign-release.sh and the app's public keys.
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The app's updater refuses a download that SHA256SUMS does not
      # list (crates/xen-update): every package must be in it.
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          packages=$(find . -maxdepth 1 -type f ! -name SHA256SUMS | wc -l)
          listed=$(wc -l < SHA256SUMS)
          if [ "$packages" -ne 7 ] || [ "$listed" -ne "$packages" ]; then
            echo "::error::expected 7 packages listed in SHA256SUMS, found $packages files and $listed lines"
            exit 1
          fi
      # The key is passed to the script in the environment only; it writes
      # it to a private temporary file, removes it, and never prints it.
      - name: Sign SHA256SUMS (when the signing key secret is set)
        env:
          REXEN_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -z "$REXEN_SIGNING_KEY" ]; then
            echo "::notice::No RELEASE_SIGNING_KEY secret: SHA256SUMS is not signed here. Sign it offline with packaging/sign-release.sh (packaging/release-signing/README.md)."
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends minisign
          src/packaging/sign-release.sh --version "$VERSION" dist
      - uses: actions/upload-artifact@v7
        with:
          name: rexen-center-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rexen-center-${{ needs.version.outputs.version }}
          path: dist
      # What is published is what was checksummed: the updater verifies
      # each download against this file and refuses one it does not match.
      - name: Verify the packages against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      # Unsigned, the release is created as a draft: the app would refuse
      # to install it, so it is published once it is signed offline.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          draft=()
          if [ ! -f dist/SHA256SUMS.minisig ]; then
            draft=(--draft)
            echo "::warning::SHA256SUMS is not signed: $TAG is created as a draft. Sign it with packaging/sign-release.sh, upload SHA256SUMS.minisig and publish the draft (packaging/release-signing/README.md)."
          fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            "${draft[@]}" \
            --title "ReXen Center $VERSION" \
            --generate-notes
