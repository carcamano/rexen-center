# Builds the release packages on GitHub-hosted runners:
#   macOS    rexen-center-<version>-macos-arm64.dmg (Apple Silicon)
#            rexen-center-<version>-macos-x86_64.dmg (Intel)
#   Windows  rexen-center-<version>-windows-x64.zip and .msi
#   Linux    rexen-center_<version>-1_amd64.deb (Debian, Ubuntu)
#            rexen-center-<version>-1.x86_64.rpm (Fedora)
#            rexen-center-<version>-linux-x86_64.tar.gz
#   SHA256SUMS of all of them.
# A tag v<version> also publishes them as a GitHub Release with generated
# notes; the tag must match the workspace version in Cargo.toml. A push to
# release-prep or a manual run only attaches them to the run. Nothing is
# signed or notarized.
name: Release

on:
  push:
    tags: ["v*"]
    branches: [release-prep]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        name: Read the workspace version and check the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::no version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version (expected v$version)"
            exit 1
          fi

  macos:
    name: macOS (${{ matrix.arch }})
    needs: version
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update
          rustup default stable
      - name: Build the app and disk image
        env:
          TARGET: ${{ matrix.target }}
        run: packaging/macos/build.sh dist
      - name: Check the artifact name
        run: test -f "dist/rexen-center-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install the WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      - name: Build the zip and installer
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -Out dist
      - name: Check the artifact names
        shell: bash
        run: |
          test -f "dist/rexen-center-${{ needs.version.outputs.version }}-windows-x64.zip"
          test -f "dist/rexen-center-${{ needs.version.outputs.version }}-windows-x64.msi"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  linux:
    name: Linux (x86_64)
    needs: version
    # The oldest hosted Ubuntu, so the binary runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libdbus-1-dev dpkg-dev rpm
      - name: Install Rust and the packaging tools
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo install --locked cargo-deb@3.8.0 cargo-generate-rpm@0.21.1
      - name: Build the packages
        run: packaging/linux/build.sh dist
      - name: Check the packages
        run: |
          version=${{ needs.version.outputs.version }}
          test -f "dist/rexen-center-$version-linux-x86_64.tar.gz"
          test -f "dist/rexen-center_${version}-1_amd64.deb"
          test -f "dist/rexen-center-${version}-1.x86_64.rpm"
          dpkg-deb --info "dist/rexen-center_${version}-1_amd64.deb"
          dpkg-deb --contents "dist/rexen-center_${version}-1_amd64.deb"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: rexen-center-${{ needs.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rexen-center-${{ needs.version.outputs.version }}
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "ReXen Center $VERSION" \
            --generate-notes
