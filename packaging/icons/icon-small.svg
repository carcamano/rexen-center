    <path d="M-72 40 C -128 70 -146 128 -136 168 L -66 126 Z" fill="url(#blue)"/>
    <path d="M72 40 C 128 70 146 128 136 168 L 66 126 Z" fill="url(#blue)"/>
    <rect x="-44" y="118" width="88" height="34" rx="10" fill="url(#blue)"/>
    <path d="M0 -230 C 74 -166 86 -50 74 128 L -74 128 C -86 -50 -74 -166 0 -230 Z" fill="#F3F5F8"/>
    <path d="M0 -230 C 44 -192 64 -150 70 -112 L -70 -112 C -64 -150 -44 -192 0 -230 Z" fill="url(#rust)"/>
