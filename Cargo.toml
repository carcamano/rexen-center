[workspace]
resolver = "3"
members = ["crates/xapi", "crates/xapi-codegen", "crates/xen-core", "crates/xen-vnc", "crates/xen-rrd", "crates/xapi-mock", "crates/xen-mcp", "crates/xen-update", "crates/xenadmin"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-2-Clause"
publish = false
repository = "https://github.com/carcamano/rexen-center"

[workspace.dependencies]
xapi = { path = "crates/xapi" }
xen-core = { path = "crates/xen-core" }
xapi-mock = { path = "crates/xapi-mock" }
xen-vnc = { path = "crates/xen-vnc" }
xen-rrd = { path = "crates/xen-rrd" }
xen-mcp = { path = "crates/xen-mcp" }
xen-update = { path = "crates/xen-update" }

arc-swap = "1.7"
bytes = "1"
directories = "6"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
egui_plot = "0.38"
flate2 = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
quick-xml = "0.41"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
ring = "0.17"
roxmltree = "0.21"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The CA check of the update client: reqwest's own platform verifier
# (the system's trust store), already part of its rustls stack.
rustls-platform-verifier = "0.7"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tar = { version = "0.4", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 8 is the last major release for Rust 1.88.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
