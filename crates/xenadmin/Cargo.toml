[package]
name = "xenadmin"
description = "Desktop management console for XCP-ng / XAPI pools (egui)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The package keeps its development name; the program is ReXen Center's.
[[bin]]
name = "rexencenter"
path = "src/main.rs"

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
egui_plot = { workspace = true }
rfd = { workspace = true }
sys-locale = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
xapi = { workspace = true }
xen-core = { workspace = true }
xen-mcp = { workspace = true }
xen-rrd = { workspace = true }
xen-vnc = { workspace = true }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
flate2 = { workspace = true }
serde_json = { workspace = true }
xapi-mock = { workspace = true }
xen-vnc = { workspace = true, features = ["testing"] }

[lints]
workspace = true

# Embeds packaging/icons/icon.ico in the Windows executable (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
