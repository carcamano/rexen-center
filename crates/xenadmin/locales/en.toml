blurb_nfs = """
NFS servers are a common form of shared filesystem infrastructure, and can be used as a storage repository substrate for virtual disks.

As NFS storage repositories are shared, the virtual disks stored in them allow VMs to be started on any server in a resource pool and to be migrated between them using Live Migration.

When you configure an NFS storage repository, you simply provide the host name or IP address of the NFS server and the path to a directory that will be used to contain the storage repository. The NFS server must be configured to export the specified path to all servers in the pool."""
blurb_iscsi = "iSCSI or Fibre Channel access to a shared LUN can be configured to host fully provisioned virtual disks using LVM or be formatted with the GFS2 cluster file system for hosting thinly provisioned virtual disks."
blurb_smb = """
SMB servers are a common form of Windows shared filesystem infrastructure, and can be used as a storage repository substrate for virtual disks.

As SMB storage repositories are shared, the virtual disks stored in them allow VMs to be started on any server in a resource pool and to be migrated between them using Live Migration.

When you configure a SMB storage repository, you simply provide the host name or IP address of the SMB server, the user name, the password and the path to a directory that will be used to contain the storage repository. The SMB server must support version 3 and be configured to export the specified path to all servers in the pool."""
blurb_local = "Select this option to create a local storage repository."
blurb_nfs_iso = "Select this option if you have a library of VM installation ISO images available as a NFS share that you want to attach to your host or pool."
blurb_smb_iso = "Select this option if you have a library of VM installation ISO images available as a Windows (SMB/CIFS) share that you want to attach to your host or pool."
