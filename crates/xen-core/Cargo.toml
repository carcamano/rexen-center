ring = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
xapi = { workspace = true }
xen-rrd = { workspace = true }
xen-vnc = { workspace = true }

[target.'cfg(unix)'.dependencies]
